# Render blueprint for the Kadr backend. In Render: New → Blueprint → point at
# this repo; it builds backend/Dockerfile as a free Docker web service. Set the
# GEMINI_API_KEY value in the dashboard (sync: false keeps it out of the repo).
services:
  - type: web
    name: kadr-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    # Don't redeploy the backend on every git push (frontend-only changes were
    # taking it down for minutes). Deploy backend changes manually via Render's
    # "Manual Deploy" button.
    autoDeploy: false
    envVars:
      - key: GEMINI_API_KEY
        sync: false
